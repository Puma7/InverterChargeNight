name: Feature request
description: Something the integration should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to achieve?
      description: |
        The situation, not the solution - tariff, inverter, battery, what the
        night should look like. That usually shows whether the integration can
        already do it another way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      validations:
        required: false
