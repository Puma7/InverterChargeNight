# Deliberately explicit: no LAN discovery and no real inverter addresses.
homeassistant:
  name: Inverter Charge Night Lab
  latitude: 52.52
  longitude: 13.405
  elevation: 35
  unit_system: metric
  time_zone: Europe/Berlin
  country: DE
  currency: EUR
frontend:
config:
http:
  server_host: 0.0.0.0
  server_port: 8123
api:
websocket_api:
history:
logbook:
recorder:
  purge_keep_days: 7
  commit_interval: 5
sun:
system_health:
logger:
  default: warning
  logs:
    custom_components.inverter_charge_night: debug
    custom_components.icn_simulator: info
    custom_components.kostal_kore: info
icn_simulator:
  auto_configure: true
  capacity_kwh: 35.8
  kostal_emulator: true
  auto_configure_kore: true
  api_port: 18080
  persist_plant: true
lovelace:
  dashboards:
    icn-lab:
      mode: yaml
      title: ICN Labor
      icon: mdi:flask
      show_in_sidebar: true
      filename: dashboard.yaml
