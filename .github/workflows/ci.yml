name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Home Assistant (the floor declared in hacs.json)
          - python-version: "3.13"
            homeassistant: "==2025.2.0"
          # Newest Home Assistant; it requires Python 3.14
          - python-version: "3.14"
            homeassistant: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # There is no requirements.txt or pyproject.toml; without this the
          # cache step fails and the job never reaches the tests.
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install "homeassistant${{ matrix.homeassistant }}"
      - run: pytest
      # Both checkers parse Home Assistant's own sources too, so they have to
      # assume the version this job runs: the newest HA uses 3.14-only syntax
      # that a checker pinned to 3.13 rejects before it looks at our code.
      - run: mypy --python-version ${{ matrix.python-version }} custom_components/inverter_charge_night/
      - run: pyright --pythonversion ${{ matrix.python-version }}
      - run: python scripts/smoke_real_ha.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
