name: Home Assistant laboratory
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lab/**'
      - 'custom_components/inverter_charge_night/**'
      - '.github/workflows/ha-lab.yml'
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KOSTAL_REPO_PATH: ${{ github.workspace }}/.kostal-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Puma7/KostalKore
          ref: 4a9100e76fe60e03018a22cc07f9a7f1287e164b
          path: .kostal-fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: lab/requirements-native.txt
      - run: pip install -r requirements-dev.txt -r lab/requirements-native.txt
      - run: python -m pytest
      - run: python lab/check_real_ha.py
      # The real Kostal REST client uses the inverter's standard port 80.
      - run: sudo -E "$(command -v python)" lab/check_kostal.py
      - run: python lab/install_evcc.py
      - run: sudo -E "$(command -v python)" lab/check_grid.py
      - run: python lab/check_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-lab-reports
          path: lab/reports/*.json
